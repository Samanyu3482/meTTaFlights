<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Flight Bot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    #chatbox {
      width: 400px;
      height: 500px;
      border: 1px solid #ccc;
      display: flex;
      flex-direction: column;
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .msg {
      margin: 5px 0;
      padding: 8px;
      border-radius: 6px;
      max-width: 70%;
    }

    .user {
      background: #007bff;
      color: #fff;
      margin-left: auto;
    }

    .bot {
      background: #f1f1f1;
      color: #000;
      margin-right: auto;
    }

    .card {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px;
      margin: 8px 0;
      background: #fafafa;
    }

    .card-title {
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 16px;
    }

    .card-subtitle {
      font-size: 14px;
      margin-bottom: 8px;
      color: #333;
      white-space: pre-line;
    }

    .segments {
      margin-top: 6px;
      padding-left: 12px;
      font-size: 13px;
      color: #444;
    }

    .card button {
      padding: 6px 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 6px;
    }

    .card button:hover {
      background: #0056b3;
    }

    #inputArea {
      display: flex;
      border-top: 1px solid #ccc;
    }

    #inputArea input {
      flex: 1;
      padding: 10px;
      border: none;
    }

    #inputArea button {
      padding: 10px;
      border: none;
      background: #007bff;
      color: #fff;
    }
  </style>
</head>

<body>
  <div id="chatbox">
    <div id="messages"></div>
    <div id="inputArea">
      <input id="userInput" type="text" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("userInput");

    function addMessage(text, sender) {
      const msg = document.createElement("div");
      msg.classList.add("msg", sender);
      msg.innerText = text;
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addCard(flight) {
      const cardEl = document.createElement("div");
      cardEl.classList.add("card");

      const title = document.createElement("div");
      title.classList.add("card-title");
      title.innerText = flight.airline || "Flight Details";
      cardEl.appendChild(title);

      const subtitle = document.createElement("div");
      subtitle.classList.add("card-subtitle");
      subtitle.innerText =
        `Route: ${flight.source} → ${flight.destination}\n` +
        `Date: ${flight.year}-${flight.month}-${flight.day}\n` +
        `Departure: ${flight.departure}\n` +
        `Arrival: ${flight.arrival}\n` +
        `Duration: ${flight.duration_minutes} mins\n` +
        `Cost: $${flight.cost}`;
      cardEl.appendChild(subtitle);

      if (flight.is_connecting && flight.segments) {
        const segTitle = document.createElement("div");
        segTitle.innerText = "Segments:";
        segTitle.style.fontWeight = "bold";
        cardEl.appendChild(segTitle);

        const segList = document.createElement("div");
        segList.classList.add("segments");
        flight.segments.forEach((seg, i) => {
          const segItem = document.createElement("div");
          segItem.innerText =
            `${i + 1}. ${seg.source} → ${seg.destination} | ${seg.takeoff} → ${seg.landing}\n` +
            `   Airline: ${seg.airline}, Cost: $${seg.cost}, Duration: ${seg.duration} mins`;
          segList.appendChild(segItem);
        });
        cardEl.appendChild(segList);

        const layover = document.createElement("div");
        layover.classList.add("segments");
        layover.innerText = `Layover at ${flight.connection_airport}: ${flight.layover_hours} hrs`;
        cardEl.appendChild(layover);
      }

      const btn = document.createElement("button");
      btn.innerText = "Book This Flight";
      btn.onclick = () => bookFlight(flight);
      cardEl.appendChild(btn);

      messagesEl.appendChild(cardEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const text = inputEl.value;
      if (!text) return;
      addMessage(text, "user");
      inputEl.value = "";

      try {
        const res = await fetch("http://localhost:5005/webhooks/rest/webhook", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sender: "user", message: text })
        });
        const data = await res.json();

        data.forEach(msg => {
          if (msg.text) addMessage(msg.text, "bot");
          if (msg.custom && msg.custom.flights) {
            msg.custom.flights.forEach(addCard);
          }

        });
      } catch (err) {
        addMessage("⚠️ Server error, could not reach Rasa.", "bot");
        console.error(err);
      }
    }

    async function bookFlight(flight) {
      addMessage("✈️ Booking flight: " + flight.source + " → " + flight.destination, "user");
      try {
        const res = await fetch("http://localhost:5005/webhooks/rest/webhook", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sender: "user",
            message: "/request_booking",
            metadata: {
              flight_info: flight
            }
          })
        });
        const data = await res.json();
        data.forEach(msg => {
          if (msg.text) addMessage(msg.text, "bot");
        });
      } catch (err) {
        addMessage("⚠️ Server error while booking.", "bot");
        console.error(err);
      }
    }
  </script>
</body>

</html>
